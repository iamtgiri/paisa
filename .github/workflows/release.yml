name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager --sdk_root="$sdk_root" "platforms;android-36"
          for attempt in 1 2 3; do
            rm -rf "$sdk_root/cmake/3.22.1" "$sdk_root/.temp"
            if sdkmanager --sdk_root="$sdk_root" "cmake;3.22.1"; then
              exit 0
            fi
            echo "CMake installation attempt $attempt failed; retrying."
          done
          exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Configure stable Android release signing
        env:
          PAISA_KEYSTORE_BASE64: ${{ secrets.PAISA_KEYSTORE_BASE64 }}
          PAISA_KEYSTORE_PASSWORD: ${{ secrets.PAISA_KEYSTORE_PASSWORD }}
          PAISA_KEY_ALIAS: ${{ secrets.PAISA_KEY_ALIAS }}
          PAISA_KEY_PASSWORD: ${{ secrets.PAISA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$PAISA_KEYSTORE_BASE64" || { echo "Missing PAISA_KEYSTORE_BASE64"; exit 1; }
          test -n "$PAISA_KEYSTORE_PASSWORD" || { echo "Missing PAISA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$PAISA_KEY_ALIAS" || { echo "Missing PAISA_KEY_ALIAS"; exit 1; }
          test -n "$PAISA_KEY_PASSWORD" || { echo "Missing PAISA_KEY_PASSWORD"; exit 1; }
          printf '%s' "$PAISA_KEYSTORE_BASE64" | base64 --decode > android/paisa-upload.jks
          cat > android/key.properties <<EOF
          storeFile=paisa-upload.jks
          storePassword=$PAISA_KEYSTORE_PASSWORD
          keyAlias=$PAISA_KEY_ALIAS
          keyPassword=$PAISA_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/paisa-upload.jks
