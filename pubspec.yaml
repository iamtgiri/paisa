name: paisa
description: Personal offline-first finance tracker — track expenses, budgets, investments & savings.
publish_to: 'none'
version: 1.2.2+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.68.0

  # UI / Fonts
  google_fonts: ^6.2.1

  # Date formatting
  intl: ^0.19.0

  # Export & share
  share_plus: ^10.0.0
  csv: ^6.0.0

  # File import
  file_picker: ^8.0.0

  # Local notifications
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
